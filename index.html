<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2025-26 Topps Pristine Pack Rip Simulator</title>
<style>
  :root{
    --bg:#0c1016; --panel:#141a23; --panel2:#1a212c; --line:#262f3d;
    --text:#eef2f7; --muted:#8b97a8;
    --base:#93a3b8; --refractor:#38bdf8; --insert:#6366f1; --parallel:#a855f7;
    --instant:#14b8a6; --auto:#eab308; --relic:#f97316; --ssp:#ec4899;
  }
  :root[data-theme="light"]{
    --bg:#f4f6f9; --panel:#ffffff; --panel2:#eef1f6; --line:#dde3ec; --text:#171c24; --muted:#5b6674;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100%;
  }
  .app{ max-width:680px; margin:0 auto; padding:28px 18px 48px; }
  h1{ font-size:clamp(24px,6vw,32px); font-weight:800; letter-spacing:-0.02em; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.5; }
  .stage{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .count-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:16px; }
  .count-row .n{ font-size:13px; color:var(--muted); }
  .count-row .n b{ color:var(--text); font-variant-numeric:tabular-nums; }
  .cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:18px; }
  @media(max-width:540px){ .cards{ grid-template-columns:repeat(2,1fr); } }

  .card-container{
    aspect-ratio:3/4; perspective:1000px; cursor:pointer;
  }
  .card-container.unclickable{ cursor:default; }
  
  .card-inner{
    position:relative; width:100%; height:100%;
    transition:transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style:preserve-3d;
  }
  .card-container.revealed .card-inner{
    transform:rotateY(180deg);
  }

  .card-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:10px; border:1px solid var(--line); display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:10px 8px; overflow:hidden;
  }

  .card-back{
    background:linear-gradient(135deg, var(--panel2) 0%, var(--line) 100%);
    color:var(--muted); font-weight:800; font-size:11px; text-transform:uppercase; letter-spacing:0.08em;
  }
  .card-back span{ font-size:20px; margin-bottom:4px; display:block; color:var(--text); }

  .card-front{
    background:var(--panel2); transform:rotateY(180deg); justify-content:space-between;
  }

  .card-front .cat-badge{
    background:rgba(0,0,0,0.35); color:var(--text); font-size:9px; font-weight:800;
    text-transform:uppercase; letter-spacing:0.06em; padding:3px 7px; border-radius:4px;
    border:1px solid rgba(255,255,255,0.15); width:100%; text-overflow:ellipsis; overflow:hidden; white-space:nowrap;
  }
  .card-front .card-body{
    display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; width:100%; padding:4px 0;
  }
  .card-front .pname{ font-size:12px; font-weight:800; line-height:1.25; color:var(--text); margin-bottom:4px; }
  .card-front .det{ font-size:11px; color:var(--text); font-weight:700; background:rgba(0,0,0,0.25); padding:2px 6px; border-radius:4px; border:1px solid rgba(255,255,255,0.1); max-width:100%; word-break:break-word; }
  
  @keyframes flashHit {
    0%, 100% { opacity: 1; filter: brightness(1); }
    50% { opacity: 0.4; filter: brightness(1.8); }
  }
  .card-front.flash {
    animation: flashHit 0.6s ease-in-out 2;
  }

  .card-front.gold-shine::after {
    content:""; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(234,179,8,0) 0%, rgba(234,179,8,0.45) 50%, rgba(234,179,8,0) 100%);
    animation:shine 1.2s ease-in-out infinite;
    pointer-events:none;
  }

  .card-front.superfractor {
    background: linear-gradient(135deg, #1c1808 0%, #42360b 50%, #1c1808 100%) !important;
    border-color: #eab308 !important;
    box-shadow: 0 0 15px rgba(234,179,8,0.6);
  }
  .card-front.superfractor::before {
    content:""; position:absolute; inset:0;
    background: radial-gradient(circle at 50% 50%, rgba(255,230,128,0.4) 0%, transparent 70%),
                repeating-radial-gradient(circle at 50% 50%, transparent, transparent 4px, rgba(234,179,8,0.15) 5px, transparent 6px);
    animation: vinylSpin 4s linear infinite;
    pointer-events:none;
  }
  @keyframes vinylSpin {
    from { transform: rotate(0deg) scale(1.2); }
    to { transform: rotate(360deg) scale(1.2); }
  }

  @keyframes shine{ from{ transform:translateX(-120%); } to{ transform:translateX(120%); } }
  .hit-note{ min-height:24px; text-align:center; font-size:13px; color:var(--muted); margin-bottom:16px; }
  .hit-note b{ color:var(--text); }
  .controls{ display:flex; gap:8px; flex-wrap:wrap; }
  button{
    font:inherit; font-weight:700; font-size:14px; border-radius:9px; border:1px solid var(--line);
    padding:11px 16px; cursor:pointer; background:var(--panel2); color:var(--text);
  }
  button:focus-visible{ outline:2px solid var(--refractor); outline-offset:2px; }
  #mainActionBtn{ background:var(--text); color:var(--bg); border-color:transparent; flex:1 1 140px; }
  #resetBtn{ margin-left:auto; color:var(--muted); }
  table{ width:100%; border-collapse:collapse; margin-top:22px; font-size:13px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:600; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
</style>
</head>
<body>
<div class="app">
  <h1>2025-26 Topps Pristine Simulator</h1>
  <p class="sub">Simulating packs with strict checklist routing, accurate dual auto pairs, and state-tracked card flips.</p>

  <div class="stage">
    <div class="count-row">
      <span class="n">Packs opened: <b id="packCount">0</b></span>
      <span class="n">Cards pulled: <b id="cardCount">0</b></span>
    </div>
    <div class="cards" id="cards"></div>
    <div class="hit-note" id="hitNote">Rip a pack to test your box luck.</div>
    <div class="controls">
      <button id="mainActionBtn">Rip a pack</button>
      <button id="resetBtn">Reset</button>
    </div>
  </div>

  <table id="statsTable">
    <thead><tr><th>Category</th><th class="num">Expected / Pack</th><th class="num">Your Rate</th><th class="num">Pulled</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const VETS_AND_LEGENDS = [
  "Trae Young", "Kristaps Porzingis", "Jalen Johnson", "Jayson Tatum", "Jaylen Brown", "Derrick White", "Cam Thomas", "Michael Porter Jr.", "Nic Claxton", "LaMelo Ball",
  "Brandon Miller", "Miles Bridges", "Josh Giddey", "Coby White", "Matas Buzelis", "Donovan Mitchell", "Darius Garland", "Evan Mobley", "Anthony Davis", "Kyrie Irving",
  "Klay Thompson", "Nikola Jokić", "Jamal Murray", "Aaron Gordon", "Cade Cunningham", "Jaden Ivey", "Jalen Duren", "Stephen Curry", "Draymond Green", "Jonathan Kuminga",
  "Kevin Durant", "Alperen Sengun", "Amen Thompson", "Tyrese Haliburton", "Pascal Siakam", "Bennedict Mathurin", "Kawhi Leonard", "James Harden", "Bradley Beal", "LeBron James",
  "Austin Reaves", "Luka Dončić", "Ja Morant", "Jaren Jackson Jr.", "Zach Edey", "Bam Adebayo", "Tyler Herro", "Andrew Wiggins", "Giannis Antetokounmpo", "Kyle Kuzma",
  "Myles Turner", "Anthony Edwards", "Rudy Gobert", "Rob Dillingham", "Jordan Poole", "Dejounte Murray", "Trey Murphy III", "Jalen Brunson", "Mikal Bridges", "OG Anunoby",
  "Shai Gilgeous-Alexander", "Chet Holmgren", "Jalen Williams", "Paolo Banchero", "Franz Wagner", "Jalen Suggs", "Joel Embiid", "Tyrese Maxey", "Paul George", "Devin Booker",
  "Grayson Allen", "Jalen Green", "Scoot Henderson", "Shaedon Sharpe", "Damian Lillard", "Domantas Sabonis", "Keegan Murray", "Malik Monk", "Victor Wembanyama", "De'Aaron Fox",
  "Stephon Castle", "Scottie Barnes", "RJ Barrett", "Immanuel Quickley", "Lauri Markkanen", "Walker Kessler", "Isaiah Collier", "Alex Sarr", "Bilal Coulibaly", "Bub Carrington",
  "Shaquille O'Neal", "Magic Johnson", "Larry Bird", "Kareem Abdul-Jabbar", "Bill Russell", "Wilt Chamberlain", "Hakeem Olajuwon", "Kevin Garnett", "Allen Iverson", "Steve Nash",
  "Dirk Nowitzki", "Dwyane Wade", "Paul Pierce", "Tracy McGrady", "Manu Ginobili", "Tony Parker", "David Robinson", "Karl Malone", "Richard Jefferson", "Vince Carter"
];

const ROOKIES = [
  "Cooper Flagg (RC)", "Kon Knueppel (RC)", "VJ Edgecombe (RC)", "Jeremiah Fears (RC)", "Derik Queen (RC)", "Cedric Coward (RC)", "Dylan Harper (RC)", "Tre Johnson III (RC)", "Maxime Raynaud (RC)", "Ace Bailey (RC)",
  "Egor Dëmin (RC)", "Ryan Kalkbrenner (RC)", "Will Richard (RC)", "Ryan Nembhard (RC)", "Danny Wolf (RC)", "Collin Murray-Boyles (RC)", "Sion James (RC)", "Walter Clayton Jr. (RC)", "Kobe Sanders (RC)", "Drake Powell (RC)",
  "Kasparas Jakučionis (RC)", "Asa Newell (RC)", "Nique Clifford (RC)", "Ben Saraf (RC)", "Tyrese Proctor (RC)", "Jase Richardson (RC)", "Liam McNeeley (RC)", "Micah Peavy (RC)", "Hugo González (RC)", "Will Riley (RC)"
];

const DUAL_AUTO_PAIRS = [
  "Jayson Tatum & Jaylen Brown",
  "Stephen Curry & Draymond Green",
  "LeBron James & Anthony Davis",
  "Luka Dončić & Kyrie Irving",
  "Nikola Jokić & Jamal Murray",
  "Shai Gilgeous-Alexander & Chet Holmgren",
  "Tyrese Haliburton & Pascal Siakam",
  "Victor Wembanyama & Stephon Castle",
  "Cooper Flagg (RC) & Dylan Harper (RC)",
  "Kon Knueppel (RC) & Ace Bailey (RC)",
  "Devin Booker & Kevin Durant",
  "Donovan Mitchell & Darius Garland",
  "Paolo Banchero & Franz Wagner",
  "Anthony Edwards & Rob Dillingham",
  "Magic Johnson & Larry Bird",
  "Shaquille O'Neal & Dwyane Wade"
];

const ALL_PLAYERS = [...VETS_AND_LEGENDS, ...ROOKIES];

const PARALLELS_CONFIG = [
  { name: "Green", print: 150 },
  { name: "Purple", print: 99 },
  { name: "Blue", print: 75 },
  { name: "Gold", print: 50 },
  { name: "Orange", print: 25 },
  { name: "Red", print: 5 },
  { name: "SuperFractor", print: 1 }
];

const WEIGHTED_PARALLEL_POOL = [];
PARALLELS_CONFIG.forEach(tier => {
  for (let i = 1; i <= tier.print; i++) {
    WEIGHTED_PARALLEL_POOL.push({ name: tier.name, print: tier.print, num: i });
  }
});

function randParallel() {
  const selected = WEIGHTED_PARALLEL_POOL[Math.floor(Math.random() * WEIGHTED_PARALLEL_POOL.length)];
  return { text: `${selected.name} /${selected.print} (#${selected.num})`, print: selected.print, name: selected.name };
}

const INSTANT_CONFIG = [
  { name: "Teal Glitter", print: 57 },
  { name: "Black Glitter", print: 11 }
];
const WEIGHTED_INSTANT_POOL = [];
INSTANT_CONFIG.forEach(tier => {
  for (let i = 1; i <= tier.print; i++) {
    WEIGHTED_INSTANT_POOL.push({ name: tier.name, print: tier.print, num: i });
  }
});

function randInstantParallel() {
  const selected = WEIGHTED_INSTANT_POOL[Math.floor(Math.random() * WEIGHTED_INSTANT_POOL.length)];
  return { text: `${selected.name} /${selected.print} (#${selected.num})`, print: selected.print };
}

const CATS = [
  {name:'Base', color:'var(--base)', expected:1.6, guaranteed:1, poolWeight:0.6},
  {name:'Base Refractor', color:'var(--refractor)', expected:1.0, guaranteed:1, poolWeight:0},
  {name:'Inserts', color:'var(--insert)', expected:0.4, weight:0.4, subTypes:['Forever', 'Fresh Out of the Box', 'Impact Frame', 'Precisionaries', 'Stacked']},
  {name:'Parallels', color:'var(--parallel)', expected:0.36, weight:0.36},
  {name:'Instant Parallels', color:'var(--instant)', expected:0.23, weight:0.23},
  {name:'Autographs', color:'var(--auto)', expected:0.26, weight:0.26, subTypes:['Pristine Autographs', 'Pristine Rookie Autographs', 'Italics Autographs', 'Mark of the Moment', 'Personal Endorsements', 'Pristine Pair Dual Auto']},
  {name:'Autograph Relics', color:'var(--relic)', expected:0.1, weight:0.1, subTypes:['Popular Demand', 'Pristine Pieces', 'Pristine Pieces Rookie Autos']},
  {name:'Super Short Prints (SSP)', color:'var(--ssp)', expected:0.05, weight:0.05, subTypes:['Grandmasters', 'Clean Court', 'Mixtape', 'Monogram']}
];

const RARE_CATS = new Set(['Autographs', 'Autograph Relics', 'Super Short Prints (SSP)', 'Parallels']);
const POOL = CATS.filter(c => c.weight !== undefined).concat([{name:'Base', color:'var(--base)', weight:0.6}]);
const POOL_TOTAL = POOL.reduce((s, c) => s + c.weight, 0);

let packs = 0;
let currentPackCards = [];
let revealedCount = 0;
let packState = 'IDLE'; // 'IDLE', 'RIPPED'
const counts = Object.fromEntries(CATS.map(c => [c.name, 0]));

function resolveCardDetails(catName) {
  let player = "";
  let detail = "";
  let printRun = 999;

  if (catName === 'Base') {
    player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    detail = "Base Standard";
  } else if (catName === 'Base Refractor') {
    player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    detail = "Refractor";
  } else if (catName === 'Inserts') {
    const subs = CATS.find(c => c.name === 'Inserts').subTypes;
    const sub = subs[Math.floor(Math.random() * subs.length)];
    detail = sub;

    if (sub === 'Fresh Out of the Box') {
      player = ROOKIES[Math.floor(Math.random() * ROOKIES.length)];
    } else if (sub === 'Forever') {
      player = VETS_AND_LEGENDS[Math.floor(Math.random() * VETS_AND_LEGENDS.length)];
    } else {
      player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    }
  } else if (catName === 'Parallels') {
    player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    const pData = randParallel();
    detail = pData.text;
    printRun = pData.print;
  } else if (catName === 'Instant Parallels') {
    player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    const iData = randInstantParallel();
    detail = iData.text;
    printRun = iData.print;
  } else if (catName === 'Autographs') {
    const subs = CATS.find(c => c.name === 'Autographs').subTypes;
    const sub = subs[Math.floor(Math.random() * subs.length)];
    
    if (sub === 'Pristine Pair Dual Auto') {
      player = DUAL_AUTO_PAIRS[Math.floor(Math.random() * DUAL_AUTO_PAIRS.length)];
      detail = `${sub} (SSP Base)`;
    } else if (sub === 'Pristine Rookie Autographs') {
      player = ROOKIES[Math.floor(Math.random() * ROOKIES.length)];
      detail = sub;
    } else {
      player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
      detail = sub;
    }
  } else if (catName === 'Autograph Relics') {
    const subs = CATS.find(c => c.name === 'Autograph Relics').subTypes;
    const sub = subs[Math.floor(Math.random() * subs.length)];
    
    if (sub === 'Pristine Pieces Rookie Autos') {
      player = ROOKIES[Math.floor(Math.random() * ROOKIES.length)];
    } else {
      player = VETS_AND_LEGENDS[Math.floor(Math.random() * VETS_AND_LEGENDS.length)];
    }
    const pData = randParallel();
    detail = `${sub} - ${pData.text}`;
    printRun = pData.print;
  } else if (catName === 'Super Short Prints (SSP)') {
    const subs = CATS.find(c => c.name === 'Super Short Prints (SSP)').subTypes;
    const sub = subs[Math.floor(Math.random() * subs.length)];
    detail = sub;

    if (sub === 'Grandmasters') {
      player = VETS_AND_LEGENDS[Math.floor(Math.random() * VETS_AND_LEGENDS.length)];
    } else {
      player = ALL_PLAYERS[Math.floor(Math.random() * ALL_PLAYERS.length)];
    }
  }

  return { player, detail, printRun };
}

function drawSlot() {
  let r = Math.random() * POOL_TOTAL;
  for (const c of POOL) {
    if (r < c.weight) return c;
    r -= c.weight;
  }
  return POOL[0];
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function openPack() {
  const packCards = [];
  
  let baseData = resolveCardDetails('Base');
  packCards.push({ cat: 'Base', color: CATS[0].color, ...baseData, revealed: false });
  
  let refData = resolveCardDetails('Base Refractor');
  packCards.push({ cat: 'Base Refractor', color: CATS[1].color, ...refData, revealed: false });
  
  for (let i = 0; i < 2; i++) {
    const chosenCat = drawSlot();
    const data = resolveCardDetails(chosenCat.name);
    packCards.push({
      cat: chosenCat.name,
      color: chosenCat.color,
      ...data,
      revealed: false
    });
  }

  shuffle(packCards);
  currentPackCards = packCards;
  revealedCount = 0;
  packs++;
  packState = 'RIPPED';
  
  packCards.forEach(c => counts[c.cat]++);
  renderUI();
}

function renderUI() {
  document.getElementById('packCount').textContent = packs;
  document.getElementById('cardCount').textContent = packs * 4;

  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = '';
  
  let bestHit = null;

  currentPackCards.forEach((c, index) => {
    const container = document.createElement('div');
    const isRevealed = (packState === 'IDLE' || c.revealed);
    container.className = 'card-container' + (isRevealed ? ' revealed unclickable' : '');
    
    const isRare = RARE_CATS.has(c.cat);
    let extraClass = '';
    if (c.printRun === 1) extraClass = ' superfractor';
    else if (c.printRun === 50) extraClass = ' gold-shine';
    else if (c.printRun <= 5) extraClass = ' flash';
    else if (isRare) extraClass = ' rare';

    container.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-back">
          <span>Card ${index + 1}</span>Topps Pristine
        </div>
        <div class="card-face card-front ${extraClass}" style="background:${c.color}; ${isRare && c.printRun !== 1 ? 'color:#0c1016;' : ''}">
          <div class="cat-badge">${c.cat}</div>
          <div class="card-body">
            <span class="pname">${c.player}</span>
            <span class="det">${c.detail}</span>
          </div>
        </div>
      </div>
    `;

    if (packState === 'RIPPED' && !isRevealed) {
      container.addEventListener('click', function() {
        if (!c.revealed) {
          c.revealed = true;
          revealedCount++;
          if (revealedCount >= 4) {
            packState = 'IDLE';
          }
          renderUI();
        }
      });
    }

    cardsEl.appendChild(container);
    if (isRare || c.printRun <= 50) {
      if (!bestHit || c.printRun < (bestHit.printRun || 999)) {
        bestHit = c;
      }
    }
  });

  const mainActionBtn = document.getElementById('mainActionBtn');
  if (packState === 'IDLE') {
    mainActionBtn.textContent = 'Rip a pack';
    if (packs === 0) {
      document.getElementById('hitNote').textContent = 'Rip a pack to test your box luck.';
    } else if (bestHit) {
      document.getElementById('hitNote').innerHTML = `Notable Pull: <b>${bestHit.cat} — ${bestHit.player} (${bestHit.detail})</b>`;
    } else {
      document.getElementById('hitNote').textContent = 'Standard pack contents.';
    }
  } else {
    mainActionBtn.textContent = 'Reveal All';
    document.getElementById('hitNote').textContent = `Click cards to flip them open (${revealedCount}/4 revealed).`;
  }

  renderStats();
}

function renderStats() {
  const tbody = document.querySelector('#statsTable tbody');
  tbody.innerHTML = '';
  CATS.forEach(c => {
    const rate = packs ? (counts[c.name] / packs) : 0;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="dot" style="background:${c.color}"></span>${c.name}</td>
      <td class="num">${c.expected.toFixed(2)}</td>
      <td class="num">${rate.toFixed(2)}</td>
      <td class="num">${counts[c.name]}</td>
    `;
    tbody.appendChild(tr);
  });
}

document.getElementById('mainActionBtn').addEventListener('click', () => {
  if (packState === 'IDLE') {
    openPack();
  } else {
    currentPackCards.forEach(c => c.revealed = true);
    revealedCount = 4;
    packState = 'IDLE';
    renderUI();
  }
});

document.getElementById('resetBtn').addEventListener('click', () => {
  packs = 0;
  currentPackCards = [];
  revealedCount = 0;
  packState = 'IDLE';
  CATS.forEach(c => counts[c.name] = 0);
  document.getElementById('cards').innerHTML = '';
  renderUI();
});

renderUI();
</script>
</body>
</html>
